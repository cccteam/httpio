name: CI
on:
  pull_request:
    types: [opened, synchronize, reopened] # these are the defaults - synchronize means 'commits pushed to PR'
  push:
    branches: [master]
    # The merge result is checked whole, and the caches its jobs save are the ones the next
    # pull requests restore: a pull request can read entries saved on its own branch and on
    # its base, nothing else.

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  golang-ci:
    uses: cccteam/github-workflows/.github/workflows/golang-ci.yml@168d16f91c117f25a36abc01057f82061512ccef # v8.3.0
    with:
      build-tags: '[""]'
      golangci-lint-version: 'v2.14.0'
  semantic-pull-request-title:
    uses: cccteam/github-workflows/.github/workflows/semantic-pull-request-title.yml@168d16f91c117f25a36abc01057f82061512ccef # v8.3.0
