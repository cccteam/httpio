name: Security Scan

on:
  schedule:
    - cron: "0 14 * * *" # Daily at 8:00 AM CDT

jobs:
  security_scan:
    uses: cccteam/github-workflows/.github/workflows/golang-security-scan.yml@9e5bf053976f0aef9f3c770cd83c6113b2f35da6 # v8.2.1
    with:
      execute-grype-scan: false
    secrets:
      SLACK_BOT_TOKEN: ${{ secrets.CCC_SLACK_BOT_TOKEN }}
      SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
      DEPENDABOT_ALERTS_TOKEN: ${{ secrets.DEPENDABOT_ALERTS_TOKEN }}
