name: Security Scan

on:
  schedule:
    - cron: "0 14 * * *" # Daily at 8:00 AM CDT
  workflow_dispatch:

jobs:
  security_scan:
    uses: cccteam/github-workflows/.github/workflows/golang-security-scan.yml@168d16f91c117f25a36abc01057f82061512ccef # v8.3.0
    with:
      # The whole-repository Semgrep scan, reported by issue; the pull request scan is the gate.
      execute-semgrep-scan: true
      execute-grype-scan: false
    secrets:
      SLACK_BOT_TOKEN: ${{ secrets.CCC_SLACK_BOT_TOKEN }}
      SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
      DEPENDABOT_ALERTS_TOKEN: ${{ secrets.DEPENDABOT_ALERTS_TOKEN }}
